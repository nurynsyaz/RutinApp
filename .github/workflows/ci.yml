name: CI

on:
  push:
    branches: [main, staging, uat]
  pull_request:
    branches: [main, staging, uat]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx nuxt prepare
      - run: npm run test
      - run: npm run lint
      - run: npm run generate